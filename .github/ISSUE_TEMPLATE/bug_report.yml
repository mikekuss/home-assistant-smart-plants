name: Bug report
description: Something in Smart Plants does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first.
        The diagnostics file and the log usually show the cause; the [troubleshooting guide](https://github.com/mikekuss/home-assistant-smart-plants/blob/main/docs/troubleshooting.md#report-a-bug) shows where to find them.
        Before attaching diagnostics or logs, check them for anything you do not want to share publicly.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Smart Plants panel
        2. ...
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.8.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Smart Plants version
      placeholder: "0.16.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Marketplace
        - HACS
        - Manual
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings → Devices & services → Smart Plants → ⋮ next to the entry → Download diagnostics, then drag the file in here.
        The file is redacted: no plant names, readings or credentials. An open Smart Plants repair is listed with the entity ID of its sensor. If setup failed, Home Assistant offers no download; paste the error shown on the entry and the log instead.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Settings → Devices & services → Smart Plants → ⋮ at the top right → Enable debug logging, reproduce the problem, then Disable debug logging there to download the log. Paste the lines that mention `smart_plants`.
        Without debug logging, errors are under Settings → System → Logs.
      render: text
  - type: textarea
    id: browser
    attributes:
      label: Panel or card issues only — browser and console errors
      description: |
        Browser or app and its version. In a desktop browser press F12 (Mac: Cmd+Option+I), open the Console tab, reload the page, repeat the problem and paste the red error lines.
