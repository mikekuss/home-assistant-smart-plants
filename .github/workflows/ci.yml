name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The Dependabot bundles workflow starts CI this way after it pushes rebuilt
  # bundles, because its push does not trigger workflows.
  workflow_dispatch:
  schedule:
    # Weekly, so the latest-Home-Assistant job notices new releases even when
    # the repository is quiet.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  layout:
    name: Layout validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate package layout
        run: python scripts/validate_layout.py

  backend:
    name: Ruff, Mypy, Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

  pytest-latest-ha:
    name: Pytest (latest Home Assistant)
    # Runs the test suite against the newest stable Home Assistant release,
    # which is what most users run. The backend job above covers the minimum
    # supported version pinned in requirements-dev.txt; together they cover
    # both schema libraries (voluptuous before 2026.9, probatio from 2026.9).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve latest Home Assistant test versions
        id: versions
        shell: python3 {0}
        run: |
          import json
          import os
          import re
          import urllib.request

          STABLE = re.compile(r"\d+\.\d+\.\d+")

          def pypi(path):
              with urllib.request.urlopen(f"https://pypi.org/pypi/{path}/json") as resp:
                  return json.load(resp)

          def key(version):
              return tuple(int(part) for part in version.split("."))

          stable_ha = max(
              (v for v in pypi("homeassistant")["releases"] if STABLE.fullmatch(v)),
              key=key,
          )

          # pytest-homeassistant-custom-component pins one exact Home Assistant
          # release, which can be a beta during the week before a monthly
          # release. Use the newest harness that pins a stable release.
          phcc_versions = sorted(
              (
                  v
                  for v in pypi("pytest-homeassistant-custom-component")["releases"]
                  if STABLE.fullmatch(v)
              ),
              key=key,
              reverse=True,
          )
          for phcc in phcc_versions[:40]:
              requires = pypi(f"pytest-homeassistant-custom-component/{phcc}")["info"][
                  "requires_dist"
              ]
              ha_version = next(
                  req.split("==", 1)[1].strip()
                  for req in requires
                  if re.match(r"homeassistant\s*==", req)
              )
              if STABLE.fullmatch(ha_version):
                  break
          else:
              raise SystemExit("No test harness release pins a stable Home Assistant")

          if ha_version != stable_ha:
              print(
                  f"::warning::Home Assistant {stable_ha} has no test harness release "
                  f"yet; testing against {ha_version} instead."
              )
          requires_python = pypi(f"homeassistant/{ha_version}")["info"]["requires_python"]
          major, minor = re.search(r">=\s*(\d+)\.(\d+)", requires_python).groups()
          print(f"newest stable homeassistant {stable_ha}")
          print(f"pytest-homeassistant-custom-component {phcc}")
          print(f"homeassistant {ha_version} (Python {requires_python})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"phcc={phcc}\n")
              out.write(f"homeassistant={ha_version}\n")
              out.write(f"python={major}.{minor}\n")
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Install latest Home Assistant test environment
        env:
          PHCC_VERSION: ${{ steps.versions.outputs.phcc }}
          HA_VERSION: ${{ steps.versions.outputs.homeassistant }}
        run: |
          python -m pip install \
            "pytest-homeassistant-custom-component==${PHCC_VERSION}" \
            "homeassistant==${HA_VERSION}"
          # The integration depends on the frontend component; install the
          # frontend package version that this Home Assistant release pins.
          frontend_reqs=$(python -c 'import json, pathlib, homeassistant.components.frontend as f; print(" ".join(json.loads((pathlib.Path(f.__file__).parent / "manifest.json").read_text())["requirements"]))')
          python -m pip install ${frontend_reqs}
          python -m pip list | grep -iE '^(homeassistant|home-assistant-frontend|pytest-homeassistant-custom-component|pillow) '
      - name: Pytest
        run: pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (production)
        run: npm run build
      - name: Verify tracked artifact is current
        run: |
          if ! git diff --exit-code -- ../custom_components/smart_plants/frontend/smart-plants-panel.js ../custom_components/smart_plants/frontend/smart-plants-card.js ../custom_components/smart_plants/frontend/smart-plants-card-full.js; then
            echo "::error::The committed bundles do not match a fresh build. Run 'npm run build' in frontend/ and commit the three bundles. On Dependabot frontend pull requests the Dependabot bundles workflow does this."
            exit 1
          fi
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (installed production artifact)
        run: npm run test:browser
      - name: Verify installed artifact layout
        # `npm run build` already runs check-artifact.mjs, but re-run it
        # here so a CI failure clearly names the broken step.
        run: npm run check-artifact
