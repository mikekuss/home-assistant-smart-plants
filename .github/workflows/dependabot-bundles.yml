name: Dependabot bundles

# A Dependabot update of the frontend toolchain (for example vite) changes the
# built panel and card bundles. CI requires the committed bundles to match a
# fresh build, so such a pull request fails until someone rebuilds them. This
# workflow does the rebuild on Dependabot's own frontend pull requests and
# commits the result to the pull request branch. Every other pull request still
# has to commit its own rebuilt bundles.

on:
  pull_request:
    paths:
      - frontend/package.json
      - frontend/package-lock.json

permissions:
  contents: read

concurrency:
  group: dependabot-bundles-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bundles
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # npm ci runs code from the updated packages, so this job keeps the
    # read-only token. Only the next job, which runs no package code, can push.
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (production)
        run: npm run build
      - name: Compare with the committed bundles
        id: diff
        run: |
          if git diff --quiet -- ../custom_components/smart_plants/frontend/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed bundles already match this build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- ../custom_components/smart_plants/frontend/
          fi
      - name: Upload rebuilt bundles
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles
          path: |
            custom_components/smart_plants/frontend/smart-plants-panel.js
            custom_components/smart_plants/frontend/smart-plants-card.js
            custom_components/smart_plants/frontend/smart-plants-card-full.js
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit rebuilt bundles
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the job start CI for the new commit. Pushes made with the workflow
      # token do not trigger workflows on their own.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Stop if the branch moved on
        env:
          BUILT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BUILT_SHA" ]; then
            echo "::notice::The branch has newer commits; their own run rebuilds the bundles."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Download rebuilt bundles
        if: env.SKIP != '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundles
          path: custom_components/smart_plants/frontend
      - name: Commit and push
        if: env.SKIP != '1'
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            custom_components/smart_plants/frontend/smart-plants-panel.js \
            custom_components/smart_plants/frontend/smart-plants-card.js \
            custom_components/smart_plants/frontend/smart-plants-card-full.js
          git commit -m "Rebuild frontend bundles with the updated toolchain"
          git push origin "HEAD:${BRANCH}"
          gh workflow run ci.yml --ref "${BRANCH}"
