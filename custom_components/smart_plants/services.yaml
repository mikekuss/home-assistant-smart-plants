log_care:
  # The entity filter also limits the device picker to devices that have a
  # matching entity, which are the Smart Plants plant devices.
  target:
    entity:
      - integration: smart_plants
        domain: binary_sensor
  fields:
    kind:
      selector:
        select:
          translation_key: care_kind
          mode: dropdown
          options:
            - watering
            - fertilizing
            - pruning
            - repotting
            - note
            - task
    occurred_at:
      selector:
        datetime:
    note:
      selector:
        text:
          multiline: true

skip_care_task:
  target:
    entity:
      - integration: smart_plants
        domain: binary_sensor

snooze:
  # The entity filter also limits the device picker to devices that have a
  # matching entity, which are the Smart Plants plant devices. An entity
  # target snoozes the plant it belongs to.
  target:
    entity:
      - integration: smart_plants
        domain: binary_sensor
  fields:
    duration:
      selector:
        duration:
          enable_day: true
    until:
      selector:
        datetime:

unsnooze:
  target:
    entity:
      - integration: smart_plants
        domain: binary_sensor

get_report:
  # Read only, so unlike the other actions it also accepts areas, floors and
  # labels. Without a target the report covers every plant. The entity filter
  # also limits the device picker to the plant devices.
  target:
    entity:
      - integration: smart_plants
        domain: binary_sensor
  fields:
    include:
      default:
        - needs_water
        - problems
        - care_tasks
      selector:
        select:
          translation_key: report_include
          multiple: true
          options:
            - needs_water
            - problems
            - care_tasks
    include_snoozed:
      default: false
      selector:
        boolean:
    language:
      selector:
        language:
          languages:
            - en
            - de
