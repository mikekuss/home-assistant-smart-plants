# Daily report, all plants, notify entity
alias: "Smart Plants: daily plant report"
description: "Created in Smart Plants → Notifications. Sends a short list of the plants that need water, have problems or have care tasks due."
mode: single
triggers:
  - trigger: time
    at: "08:00:00"
    id: smart_plants_daily_report
conditions:
  - condition: smart_plants.needs_attention
    target: { entity_id: [binary_sensor.smart_plants_all_plants] }
    options: { include: [needs_water, problems, care_tasks], include_snoozed: false }
actions:
  - action: smart_plants.get_report
    target: { entity_id: [binary_sensor.smart_plants_all_plants] }
    data: { include: [needs_water, problems, care_tasks], include_snoozed: false }
    response_variable: report
  - action: notify.send_message
    target: { entity_id: notify.mock_chat }
    data:
      title: "{{ report.title }}"
      message: "{{ report.message }}"
